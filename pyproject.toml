[tool.ruff]
target-version = "py311"
line-length = 79
include = ["run.py", "dominio/**/*.py", "plataforma/**/*.py", "auto-inicio-datos/**/*.py", "inicio-datos/docs/modelo_datos/**/*.py", "tests/**/*.py", "pyproject.toml"]
extend-exclude = [
    "auto-inicio-datos/ejecuciones",
    "plataforma/**/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D102"]
"plataforma/**/migrations/*.py" = ["D100", "D101", "E501"]

# Texto literal de reglas, prompts y diagnósticos migrados: no cambiar contenido.
"auto-inicio-datos/utils/normalizacion.py" = ["E501"]
"auto-inicio-datos/utils/extraccion.py" = ["E501"]
"auto-inicio-datos/utils/priorizacion.py" = ["E501"]

"auto-inicio-datos/tests/**/*.py" = ["D102"]
